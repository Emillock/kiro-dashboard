[project]
name = "kiro-dashboard-backend"
version = "1.0.0"
description = "Backend for the Kiro NRT metrics dashboard (S3 ingestion, metrics engine, auth, REST API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dateutil>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# Hypothesis: log seed for reproducibility (PBT-08), show statistics
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hypothesis]
# PBT-08: deterministic CI runs + seed logging
print_blob = true
